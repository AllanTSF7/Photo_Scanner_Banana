name: Build Windows desktop package

# Builds the packaged one-folder Windows bundle on a GitHub-hosted windows-latest runner (it needs
# MSVC, which the Linux self-hosted runner doesn't have), then hands the finished zip to the
# self-hosted runner just to drop it where the app itself serves it from (/api/downloads/windows,
# behind the same password as everything else). No SSH key or new secret needed for that hand-off -
# it's an artifact passed between two jobs of the same run.

on:
  push:
    branches: [main]
    paths:
      - "banana/**"
      - "native/**"
      - "vendor/exiftool_win64/**"
      - "scripts/photoscanner.spec"
      - "scripts/desktop_launcher.py"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-windows-desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install "scikit-build-core>=0.10" "nanobind>=2.1" cmake ninja pyinstaller

      - name: Build the native module (no OpenCV - nothing in the pipeline calls the OpenCV-only path)
        env:
          CMAKE_ARGS: -DCMAKE_DISABLE_FIND_PACKAGE_OpenCV=ON
        run: pip install --no-build-isolation ./native

      - name: Install the app (OCR + NER extras ship their own offline model files)
        run: pip install -e ".[dev,ocr,ner]"

      - name: Verify the native module actually loaded before packaging it
        run: python -c "import banana_core; assert not banana_core.HAVE_OPENCV; print('native ok')"

      - name: Run the real test suite first - fail fast, before spending time packaging
        run: python -m pytest -q -rs tests --ignore=tests/ui

      - name: Build the PyInstaller bundle
        run: pyinstaller scripts/photoscanner.spec --noconfirm --distpath dist --workpath build

      - name: "Smoke-test the actual exe: a real double-click launch, nothing redirected"
        # This is the case pytest can never cover, since it never runs the frozen exe at all - it's
        # exactly how the sys.stdout=None crash (windowed PyInstaller builds) got shipped once already:
        # the code passed every test, but the *packaged* exe still failed on a plain launch.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\PhotoScanner\PhotoScanner.exe" -WorkingDirectory "$env:RUNNER_TEMP" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) { throw "PhotoScanner.exe exited early (code $($proc.ExitCode))" }
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8420/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { Write-Host "Smoke test passed: $($r.Content)"; $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "PhotoScanner.exe never answered /health within 30s" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip it
        run: Compress-Archive -Path dist/PhotoScanner -DestinationPath PhotoScanner_win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoScanner_win64
          path: PhotoScanner_win64.zip
          retention-days: 14

  publish:
    needs: build
    runs-on: [self-hosted, photo-scanner]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoScanner_win64

      - name: Publish where the app serves it from
        # Must match settings.paths.data_dir/downloads in banana/web/api.py's download route -
        # data_dir (not a sibling folder) is the one path the app's own config actually names.
        run: |
          set -euo pipefail
          DEST=~/data/photo_scanner/data/downloads
          mkdir -p "$DEST"
          mv -f PhotoScanner_win64.zip "$DEST/PhotoScanner_win64.zip"
          echo "published $(date -u +%Y-%m-%dT%H:%M:%SZ), commit ${GITHUB_SHA::7}" > "$DEST/BUILD_INFO.txt"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Scanner · Sign in</title>
  <link rel="preload" href="/static/fonts/IBMPlexSans-Regular-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:,">
</head>
<body class="login-page">
  <main class="login-wrap">
    <form id="login-form" class="form card login-card" autocomplete="on">
      <div class="brand"><strong>Photo Scanner</strong></div>
      <h1 id="login-title">Sign in</h1>
      <p id="login-intro" class="muted" hidden>No account exists yet. Create the first one; it's the only time this page offers that.</p>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <div class="form-actions">
        <button type="submit" class="btn primary" id="btn-login">Sign in</button>
      </div>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
